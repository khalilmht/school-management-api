# Nom de l'application
spring.application.name=khalil
server.port=8000
# Connexion avec l'option createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://localhost:3306/school?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Affichage des requêtes SQL
spring.jpa.show-sql=true

# Mode Hibernate (Attention : en production avec Flyway, privilégiez "validate")
spring.jpa.hibernate.ddl-auto=create

# Dialecte Hibernate moderne (Recommandé pour MySQL 8+)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect